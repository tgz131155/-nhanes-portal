<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NHANES Research Studio：NHANES 数据分析、复杂抽样统计与科研论文工作台。">
  <title>NHANES Research Studio</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #172033;
      background: linear-gradient(135deg, #edf4ff, #f7f9fc);
    }
    main {
      width: 100%;
      max-width: 720px;
      padding: 48px 28px;
      text-align: center;
      background: #fff;
      border: 1px solid #e5eaf2;
      border-radius: 24px;
      box-shadow: 0 18px 55px rgba(25, 45, 80, .08);
    }
    .tag {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      color: #2158a5;
      background: #eaf2ff;
      font-size: 13px;
    }
    h1 { margin: 22px 0 12px; font-size: clamp(28px, 5vw, 40px); }
    p { color: #657087; line-height: 1.8; }
    .features {
      margin: 28px 0;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .features span {
      padding: 9px 12px;
      border: 1px solid #e6ebf2;
      border-radius: 10px;
      font-size: 14px;
    }
    .button {
      display: inline-block;
      margin-top: 10px;
      padding: 14px 24px;
      border-radius: 12px;
      color: white;
      background: #2563eb;
      text-decoration: none;
      font-weight: bold;
    }
    .button:hover { background: #1d4ed8; }
    footer { margin-top: 30px; font-size: 12px; color: #8a93a5; }
  </style>
</head>
<body>
  <main>
    <span class="tag">RESEARCH WORKSPACE</span>
    <h1>NHANES Research Studio</h1>
    <p>面向科研工作者的 NHANES 数据分析与论文研究工作台。</p>
    <div class="features">
      <span>数据管理</span>
      <span>变量字典</span>
      <span>复杂抽样分析</span>
      <span>统计图表</span>
      <span>科研质量控制</span>
    </div>
    <a class="button"
       href="https://nhanes-research-studio.streamlit.app"
       target="_blank" rel="noopener noreferrer">
      进入科研工作台 →
    </a>
    <footer>NHANES Research Studio · Research tools for investigators</footer>
  </main>
</body>
</html>
